# Builds and tests pull requests to master, so a broken build, a failing test or a forgotten EF
# migration (CallGuard.Tests checks the model against the migrations) shows up before merging. Needs no
# secrets and never publishes anything. (Pushes to master are tested by the release workflow.)
#
# Two jobs run side by side:
#   tests     runs CallGuard.Tests (about 1 minute)
#   android   builds the app in Release, signed with the default debug key, so Release-only problems
#             such as trimming show up here rather than in the release workflow (about 6 minutes)
#
# Both are skipped when the PR changes nothing the app is built from (docs, README, LICENSE, the release
# workflow, Dependabot's settings...), so such a PR can be merged right away: master's branch protection
# requires these two checks, and GitHub counts a skipped job as passed. The workflow itself always runs,
# because a required check whose whole workflow is filtered out by path would wait forever.

name: Build and test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR cancels the run that's still checking the old commit.
concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # list the PR's changed files

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Needs a build?
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # "Run workflow" by hand always builds.
          if [ -z "$PR" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")
          echo "$files"
          # What the app and its tests are built from, plus this workflow so changes to it get tried out.
          if echo "$files" | grep -qE '^(CallGuard[^/]*/|[^/]*\.slnx$|Directory\.(Packages|Build)\.(props|targets)$|global\.json$|dotnet-tools\.json$|[Nn]u[Gg]et\.config$|\.github/workflows/build-test\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app is built from changed; skipping the build and tests."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-tests-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-tests-

      - name: Test
        run: dotnet test --project CallGuard.Tests

  android:
    name: Android Release build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      PROJECT: CallGuard/CallGuard.csproj

    steps:
      # Ubuntu 26.04 mounts /tmp as a RAM disk with a ~7.8 GB per-user quota, and the workload
      # install stages its packs there. Same fix as the release workflow.
      # https://github.com/actions/runner-images/issues/14777
      - name: Move temp off the /tmp RAM disk
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          "TMPDIR=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v7

      # Installed where the runner user owns it, so the workload install needs no sudo.
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-android-

      - name: Install workloads
        run: dotnet workload restore $env:PROJECT

      - name: Install Android SDK dependencies
        run: >
          dotnet build $env:PROJECT -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=true

      - name: Build Release
        run: >
          dotnet build $env:PROJECT -f net10.0-android -c Release
          "-p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
