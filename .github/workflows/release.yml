# Builds a signed APK on every push to master and publishes it as a GitHub Release that anyone can
# download and install.
#
# The project dictates the version: CallGuard.csproj makes it 1.0.yyMMdd (the build date) with a
# versionCode of whole minutes since 2020-01-01 UTC. The release and its tag are named after the version
# the build produced (Call Guard 1.0.261021, tag v1.0.261021). Another push on the same day replaces that
# day's release with the newer build — same version, higher versionCode, so it still installs as an update.
# Pushes that only change documentation (Markdown files, docs/, LICENSE, FUNDING.yml) don't release.
# "Run workflow" in the Actions tab does the same as a push.
#
# Required repository secrets:
#   CALLGUARD_KEYSTORE_BASE64   base64 of the signing keystore (Visual Studio's "callguard" signing identity)
#   CALLGUARD_KEYSTORE_PASS     its password
# Required repository variable (public, not a secret):
#   SIGNING_CERT_SHA256         SHA-256 of the signing certificate. The release fails unless the APK is
#                               signed with it, because phones refuse an update signed with another key.

name: Release APK

on:
  push:
    branches: [master]
    # A push releases unless every file it changes is in this list.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/FUNDING.yml'
  workflow_dispatch:

# One release at a time; a push made while a release is running waits for it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create releases and their tags

jobs:
  release:
    # Linux runners bill at 1x (and are free for public repositories). Pinned rather than
    # ubuntu-latest so an image migration never changes the build without a commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      PROJECT: CallGuard/CallGuard.csproj
      PACKAGE_NAME: com.acclscompany.callguard
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The version carries the local build date (yyMMdd). Build in the same timezone as local builds,
      # so a late-evening release doesn't get the next day's date.
      TZ: America/Phoenix

    steps:
      # Ubuntu 26.04 mounts /tmp as a RAM disk with a ~7.8 GB per-user quota, and the workload
      # install stages its packs there ("Disk quota exceeded"). Point temp at the runner's disk.
      # https://github.com/actions/runner-images/issues/14777
      - name: Move temp off the /tmp RAM disk
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          "TMPDIR=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v7

      # Install the SDK somewhere the runner user owns, so the workload install needs no sudo.
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      # Don't release something whose tests fail.
      - name: Test
        run: dotnet test --project CallGuard.Tests

      - name: Install workloads
        run: dotnet workload restore $env:PROJECT

      - name: Install Android SDK dependencies
        run: >
          dotnet build $env:PROJECT -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLGUARD_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw "The CALLGUARD_KEYSTORE_BASE64 secret isn't set" }
          $path = Join-Path $env:RUNNER_TEMP 'callguard.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Fails in seconds and names the bad secret, instead of failing at the end of the build.
      - name: Check signing secrets
        env:
          CALLGUARD_KEYSTORE_PASS: ${{ secrets.CALLGUARD_KEYSTORE_PASS }}
        run: |
          if (-not $env:CALLGUARD_KEYSTORE_PASS) { throw "The CALLGUARD_KEYSTORE_PASS secret isn't set" }
          $keytool = Join-Path $env:JAVA_HOME 'bin/keytool'
          $entries = & $keytool -list -keystore $env:KEYSTORE_PATH -storepass:env CALLGUARD_KEYSTORE_PASS 2>&1
          if ($LASTEXITCODE -ne 0) { throw "CALLGUARD_KEYSTORE_PASS is wrong, or CALLGUARD_KEYSTORE_BASE64 is damaged: $entries" }
          & $keytool -list -keystore $env:KEYSTORE_PATH -storepass:env CALLGUARD_KEYSTORE_PASS -alias callguard *> $null
          if ($LASTEXITCODE -ne 0) { throw "The keystore has no 'callguard' key. Keystore contents: $entries" }
          Write-Host "Signing secrets OK"

      # CallGuard.csproj signs with this keystore when CALLGUARD_KEYSTORE_PASS is set; the password is
      # passed to the signing tool by reference, so it never appears on a command line or in the log.
      - name: Build signed APK
        env:
          CALLGUARD_KEYSTORE_PASS: ${{ secrets.CALLGUARD_KEYSTORE_PASS }}
        run: >
          dotnet publish $env:PROJECT -f net10.0-android -c Release
          "-p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
          "-p:CallGuardKeyStore=$env:KEYSTORE_PATH"

      # A release signed with any other key couldn't update the app on anyone's phone. The version is read
      # from the APK itself, so the release always carries exactly the version the app reports.
      - name: Collect APK, check its signature and read its version
        id: apk
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          if (-not $env:EXPECTED_SHA256) { throw "The SIGNING_CERT_SHA256 repository variable isn't set" }
          $apk = Get-ChildItem CallGuard/bin/Release/net10.0-android -Recurse -Filter "$env:PACKAGE_NAME-Signed.apk" |
            Where-Object { $_.FullName -match '[\\/]publish[\\/]' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw "Signed APK not found" }

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_SDK_ROOT 'build-tools') -Directory |
            Sort-Object { [version]($_.Name -replace '[^0-9.].*$', '') } | Select-Object -Last 1
          $certs = (& (Join-Path $buildTools.FullName 'apksigner') verify --print-certs $apk.FullName 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "APK signature doesn't verify:`n$certs" }
          # The wording varies between apksigner versions ("Signer #1 certificate ...", "Signer (minSdkVersion=...)
          # certificate ..."), so take every certificate digest it lists and require all of them to be the release key.
          $digests = @([regex]::Matches($certs, 'certificate SHA-256 digest:\s*([0-9a-fA-F]+)') |
            ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Select-Object -Unique)
          $expected = $env:EXPECTED_SHA256.ToLowerInvariant() -replace '[^0-9a-f]', ''
          if ($digests.Count -eq 0 -or ($digests | Where-Object { $_ -ne $expected })) {
            throw "APK isn't signed (only) with the release key $expected. apksigner said:`n$certs"
          }
          Write-Host "Signed with the release key ($expected)"

          $badging = (& (Join-Path $buildTools.FullName 'aapt2') dump badging $apk.FullName 2>&1) | Out-String
          $version = [regex]::Match($badging, "versionName='([^']*)'").Groups[1].Value
          $versionCode = [regex]::Match($badging, "versionCode='([^']*)'").Groups[1].Value
          if (-not $version -or -not $versionCode) { throw "Couldn't read the APK's version. aapt2 said:`n$badging" }
          Write-Host "Version $version (versionCode $versionCode)"

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $apk.FullName "dist/CallGuard-$version.apk"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "versionCode=$versionCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: callguard-apk
          path: dist/*.apk
          retention-days: 30

      # One release per version. A later build of the same version (same day) replaces the earlier
      # release, so its tag, notes and APK always match the newest build.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          VERSION_CODE: ${{ steps.apk.outputs.versionCode }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Replacing the existing $tag release with this newer build"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Couldn't replace the existing $tag release" }
          }

          $notes = @'
          ## Install
          1. On your Android phone (Android 10 or later), download the `.apk` below.
          2. Open it and allow your browser or Files app to install apps when Android asks.
             Google Play Protect may warn about an app from an unknown developer; choose **Install anyway**.
          3. Open Call Guard and follow the setup steps on its Home tab (see the README).

          Updating: install the new `.apk` over the old one. Your patterns and call log are kept.
          '@
          $notes += "`n`nBuild $env:VERSION_CODE."
          gh release create $tag dist/*.apk --target $env:GITHUB_SHA `
            --title "Call Guard $env:VERSION" --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create the $tag release" }

      - name: Remove keystore
        if: always()
        run: if ($env:KEYSTORE_PATH -and (Test-Path $env:KEYSTORE_PATH)) { Remove-Item $env:KEYSTORE_PATH -Force }
