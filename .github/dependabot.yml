# Weekly pull requests for outdated dependencies. Each PR runs "Build and test" like any other.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"

  # NuGet versions are kept centrally in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    groups:
      # Avalonia packages must all stay on the same version, so they always move together.
      avalonia:
        patterns:
          - "Avalonia*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "dotnet-ef"
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
